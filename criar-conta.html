<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Nexum Games</title>
    <meta name="description" content="Crie sua conta na Nexum Games para anunciar itens e acompanhar novidades.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topline" aria-hidden="true"></div>

    <header class="site-header" id="siteHeader">
        <div class="site-header__inner">
            <a href="index.html" class="logo" aria-label="Nexum Games — página inicial">
                <span class="logo__n">N</span>ex<span class="logo__u">u</span>m <span class="logo__games">Games</span>
            </a>
        </div>
    </header>

    <main>
        <section class="content-panel">
            <div class="content-panel__inner content-panel__grid">
                <div class="info-card">
                    <p class="section-eyebrow text-left">Cadastro</p>
                    <h2 class="section-title section-title--left">Crie sua conta</h2>
                    <p>Entre para anunciar itens, montar sua coleção e acompanhar os melhores jogos físicos do mercado.</p>
                </div>

                <form class="form-panel">
                    <label>
                        Nome completo
                        <input type="text" placeholder="Seu nome">
                    </label>
                    <label>
                        E-mail
                        <input type="email" placeholder="seu@email.com">
                    </label>
                    <label>
                        Senha
                        <input type="password" placeholder="Crie uma senha">
                    </label>
                    <button type="submit" class="btn btn--primary btn--block">Cadastrar</button>
                    <a href="login.html" class="btn btn--ghost btn--block">Já tenho conta</a>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <div class="site-footer__brand">
                <a href="index.html" class="logo logo--small" aria-label="Nexum Games — página inicial">
                    <span class="logo__n">N</span>ex<span class="logo__u">u</span>m <span class="logo__games">Games</span>
                </a>
                <p class="site-footer__tagline">Jogos físicos. Memórias reais.</p>
            </div>
        </div>
        <div class="site-footer__bottom">
            <p class="site-footer__copy">&copy; 2026 Nexum Games. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
